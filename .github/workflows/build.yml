name: Build

on:
  push:
    branches: [main, rust]
  pull_request:
    branches: [main, rust]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config
    
    - name: Build all packages
      run: |
        cargo build --release \
          --package pwnagotchi-bettercap \
          --package pwnagotchi-automata \
          --package pwnagotchi-plugins \
          --package pwnagotchi-cli \
          --package pwnagotchi-mesh \
          --package pwnagotchi-core
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: pwnagotchi-linux-x86_64
        path: target/release/pwnagotchi-cli

  build-raspberry-pi:
    name: Build Raspberry Pi (ARMv6/v7/ARM64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: arm-unknown-linux-gnueabihf
            name: armv6-pi-zero-w
            gcc: gcc-arm-linux-gnueabihf
          - target: armv7-unknown-linux-gnueabihf
            name: armv7-pi-2-3-4
            gcc: gcc-arm-linux-gnueabihf
          - target: aarch64-unknown-linux-gnu
            name: arm64-pi-64bit
            gcc: gcc-aarch64-linux-gnu
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.gcc }}
    
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build for ${{ matrix.name }}
      run: |
        cargo build --release --target ${{ matrix.target }} \
          --package pwnagotchi-bettercap \
          --package pwnagotchi-automata \
          --package pwnagotchi-plugins \
          --package pwnagotchi-cli \
          --package pwnagotchi-mesh \
          --package pwnagotchi-core
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: pwnagotchi-${{ matrix.name }}
        path: target/${{ matrix.target }}/release/pwnagotchi-cli
