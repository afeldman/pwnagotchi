name: Release

on:
    push:
        tags:
            - "v*"

env:
    CARGO_TERM_COLOR: always

jobs:
    create-release:
        name: Create Release
        runs-on: ubuntu-latest
        outputs:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            version: ${{ steps.get_version.outputs.version }}

        steps:
            - name: Get version from tag
              id: get_version
              run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Create Release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref_name }}
                  draft: false
                  prerelease: false
                  body: |
                      ## Pwnagotchi Rust ${{ github.ref_name }}

                      ### 🚀 Features
                      - Rust-based core implementation
                      - Python plugin support via PyO3
                      - BetterCAP integration
                      - Mesh networking capabilities

                      ### 📦 Assets
                      Download the appropriate binary for your platform below.

                      ### 🔍 Changes
                      See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

    build-linux:
        name: Build Linux (x86_64)
        needs: create-release
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libssl-dev pkg-config

            - name: Build release binary
              run: |
                  cargo build --release --workspace \
                    --exclude pwnagotchi-ui \
                    --exclude pwnagotchi-core \
                    --exclude pwnagotchi-mesh

            - name: Create tarball
              run: |
                  mkdir -p release/pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64
                  cp target/release/pwnagotchi release/pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64/ || true
                  cp -r plugins release/pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64/
                  cp pwnagotchi_plugin.py release/pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64/
                  cp README.md LICENSE release/pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64/ || true
                  cd release
                  tar czf pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64.tar.gz pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64

            - name: Upload Release Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ needs.create-release.outputs.upload_url }}
                  asset_path: ./release/pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64.tar.gz
                  asset_name: pwnagotchi-${{ needs.create-release.outputs.version }}-linux-x86_64.tar.gz
                  asset_content_type: application/gzip

    build-macos:
        name: Build macOS (universal)
        needs: create-release
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-apple-darwin,aarch64-apple-darwin

            - name: Build x86_64
              run: |
                  cargo build --release --target x86_64-apple-darwin --workspace \
                    --exclude pwnagotchi-ui \
                    --exclude pwnagotchi-core \
                    --exclude pwnagotchi-mesh

            - name: Build aarch64
              run: |
                  cargo build --release --target aarch64-apple-darwin --workspace \
                    --exclude pwnagotchi-ui \
                    --exclude pwnagotchi-core \
                    --exclude pwnagotchi-mesh

            - name: Create universal binary
              run: |
                  mkdir -p release/pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal
                  lipo -create \
                    target/x86_64-apple-darwin/release/pwnagotchi \
                    target/aarch64-apple-darwin/release/pwnagotchi \
                    -output release/pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal/pwnagotchi || true
                  cp -r plugins release/pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal/
                  cp pwnagotchi_plugin.py release/pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal/
                  cp README.md LICENSE release/pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal/ || true
                  cd release
                  tar czf pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal.tar.gz pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal

            - name: Upload Release Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ needs.create-release.outputs.upload_url }}
                  asset_path: ./release/pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal.tar.gz
                  asset_name: pwnagotchi-${{ needs.create-release.outputs.version }}-macos-universal.tar.gz
                  asset_content_type: application/gzip

    build-windows:
        name: Build Windows (x86_64)
        needs: create-release
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Build release binary
              run: |
                  cargo build --release --workspace `
                    --exclude pwnagotchi-ui `
                    --exclude pwnagotchi-core `
                    --exclude pwnagotchi-mesh

            - name: Create archive
              run: |
                  mkdir release\pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64
                  Copy-Item target\release\pwnagotchi.exe release\pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64\ -ErrorAction SilentlyContinue
                  Copy-Item -Recurse plugins release\pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64\
                  Copy-Item pwnagotchi_plugin.py release\pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64\
                  Copy-Item README.md,LICENSE release\pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64\ -ErrorAction SilentlyContinue
                  cd release
                  Compress-Archive -Path pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64 -DestinationPath pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64.zip

            - name: Upload Release Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ needs.create-release.outputs.upload_url }}
                  asset_path: ./release/pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64.zip
                  asset_name: pwnagotchi-${{ needs.create-release.outputs.version }}-windows-x86_64.zip
                  asset_content_type: application/zip

    build-arm:
        name: Build ARM (Raspberry Pi)
        needs: create-release
        runs-on: ubuntu-latest

        strategy:
            matrix:
                target:
                    - armv7-unknown-linux-gnueabihf # Raspberry Pi 2/3/4 (32-bit)
                    - aarch64-unknown-linux-gnu # Raspberry Pi 3/4 (64-bit)

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install cross-compilation tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

            - name: Build release binary
              run: |
                  cargo build --release --target ${{ matrix.target }} --workspace \
                    --exclude pwnagotchi-ui \
                    --exclude pwnagotchi-core \
                    --exclude pwnagotchi-mesh

            - name: Create tarball
              run: |
                  TARGET_NAME=$(echo ${{ matrix.target }} | sed 's/-unknown//')
                  mkdir -p release/pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}
                  cp target/${{ matrix.target }}/release/pwnagotchi release/pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}/ || true
                  cp -r plugins release/pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}/
                  cp pwnagotchi_plugin.py release/pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}/
                  cp README.md LICENSE release/pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}/ || true
                  cd release
                  tar czf pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}.tar.gz pwnagotchi-${{ needs.create-release.outputs.version }}-${TARGET_NAME}

            - name: Upload Release Asset
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ needs.create-release.outputs.upload_url }}
                  asset_path: ./release/pwnagotchi-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz
                  asset_name: pwnagotchi-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz
                  asset_content_type: application/gzip
