[package]
name = "pwnagotchi-tools"
version = "2.8.9"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "pwn-backup"
path = "src/backup.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
ssh2 = "0.9"
flate2 = "1.0"
tar = "0.4"
chrono = "0.4"
