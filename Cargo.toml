[workspace]
members = [
    "pwnagotchi-core",
    "pwnagotchi-bettercap",
    "pwnagotchi-automata",
    "pwnagotchi-mesh",
    "pwnagotchi-ui",
    "pwnagotchi-plugins",
    "pwnagotchi-py",
    "pwnagotchi-cli",
    "pwnagotchi-tools",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Anton Feldmann <anton.feldmann@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }
hyper = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Wireless/networking
pcap = "1.1"
pnet = "0.34"

# Cryptography
ed25519-dalek = "2.1"
rand = "0.8"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Display (for e-ink)
embedded-graphics = "0.8"
linux-embedded-hal = "0.4"

# Configuration
config = "0.13"
