[package]
name = "pwnagotchi-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# ONNX Runtime for production inference
ort = { version = "2.0", features = ["download-binaries"] }

# Optional: Training backends (choose one)
# burn = { version = "0.14", features = ["ndarray", "train"], optional = true }
# burn-ndarray = { version = "0.14", optional = true }
tch = { version = "0.16", optional = true }  # PyTorch for training

# Math and statistics
ndarray = "0.15"
rand = { workspace = true }

[features]
default = ["onnx"]
onnx = []  # ONNX inference (always available)
train-pytorch = ["tch"]  # Train with PyTorch, export to ONNX
train-burn = []  # Train with Burn (future)

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
